<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Used Car Price Prediction — Interactive Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>

<body>
  <nav class="sticky-nav">
    <div class="nav-content">
      <!-- Hamburger (Mobile Only) -->
      <button class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>

      <div class="nav-left desktop-logo">
        <img src="https://www.ppiu.edu.kh/public/images/logo/khlogo.png" alt="PPIU Logo" style="height: 40px; object-fit: contain;">
      </div>
      <div class="nav-center tabs desktop-tabs">
        <button class="tab-btn" onclick="loadTab('overview')" id="btn-overview">Project Overview</button>
        <button class="tab-btn active" onclick="loadTab('prediction')" id="btn-prediction">Prediction & Compare</button>
        <button class="tab-btn" onclick="loadTab('dataset')" id="btn-dataset">Dataset View</button>
        <button class="tab-btn" onclick="loadTab('workflow')" id="btn-workflow">Prediction Workflow</button>
      </div>
      <div class="nav-right">
        <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" style="margin: 0; box-shadow: none;">
          <span id="themeIcon">☀️</span> <span id="themeLabel">Light Mode</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Mobile Menu Overlay -->
  <div id="mobileMenuOverlay" class="mobile-menu-overlay">
    <div class="mobile-menu-header">
      <img src="https://www.ppiu.edu.kh/public/images/logo/khlogo.png" alt="PPIU Logo" style="height: 40px; object-fit: contain;">
      <button class="mobile-close-btn" onclick="toggleMobileMenu()" aria-label="Close Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="mobile-menu-tabs tabs">
      <button class="tab-btn" onclick="loadTab('overview'); toggleMobileMenu();" id="mobile-btn-overview">Project Overview</button>
      <button class="tab-btn active" onclick="loadTab('prediction'); toggleMobileMenu();" id="mobile-btn-prediction">Prediction & Compare</button>
      <button class="tab-btn" onclick="loadTab('dataset'); toggleMobileMenu();" id="mobile-btn-dataset">Dataset View</button>
      <button class="tab-btn" onclick="loadTab('workflow'); toggleMobileMenu();" id="mobile-btn-workflow">Prediction Workflow</button>
    </div>
  </div>

  <div class="wrap">

    <div id="overview-container" class="tab-container" style="display: none;"></div>
    <div id="prediction-container" class="tab-container"></div>
    <div id="dataset-container" class="tab-container" style="display: none;"></div>
    <div id="workflow-container" class="tab-container" style="display: none;"></div>

    <div class="footnote">
      Backend: <code>GET /feature-names</code> · <code>POST /predict</code> · OpenAPI at <code>/docs</code>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
